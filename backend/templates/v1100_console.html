<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1100 全息指揮台 — MiroFish Local Engine</title>
    <!-- Apache ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #0a0e17;
            color: #c8d6e5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .console {
            width: 100%;
            max-width: 1400px;
            height: 800px;
            border: 1px solid rgba(0, 255, 136, 0.15);
            border-radius: 12px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.05);
            overflow: hidden;
            display: flex;
        }
        .graph-panel {
            flex: 1;
            border-right: 1px solid rgba(0, 255, 136, 0.1);
            display: flex;
            flex-direction: column;
        }
        .graph-header {
            background: rgba(0, 255, 136, 0.1);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }
        .graph-header h2 {
            font-size: 1.2rem;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        #graph-container {
            flex: 1;
            position: relative;
        }
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(0, 255, 136, 0.1);
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.2);
        }
        .header h1 {
            font-size: 1.8rem;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        .input-section {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }
        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .file-input-group {
            margin-bottom: 1rem;
        }
        #file-input {
            margin-bottom: 0.5rem;
        }
        #file-input-label {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            color: #00ff88;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #file-input-label:hover {
            background: rgba(0, 255, 136, 0.2);
        }
        #file-name {
            margin-left: 1rem;
            color: #576574;
            font-size: 0.9rem;
        }
        #prompt-input {
            flex: 1;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 6px;
            color: #c8d6e5;
            font-size: 1rem;
        }
        #prompt-input:focus {
            outline: none;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        #startBtn:hover, #dailyBtn:hover, #historyBtn:hover {
            background: #00cc77;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        #startBtn:disabled, #dailyBtn:disabled, #historyBtn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #dailyBtn {
            padding: 0.75rem 1.5rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 6px;
            color: #00ff88;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #historyBtn {
            padding: 0.75rem 1.5rem;
            background: rgba(116, 185, 255, 0.1);
            border: 1px solid #74b9ff;
            border-radius: 6px;
            color: #74b9ff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }


        .terminal {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem 0;
        }
        .log-system { color: #00ff88; }
        .log-error { color: #ff6b6b; }
        .log-info { color: #74b9ff; }
        .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px #00ff88; }
            50% { opacity: 0.3; box-shadow: 0 0 12px #00ff88; }
        }
        .status {
            text-align: center;
            padding: 0.5rem;
            background: rgba(0, 255, 136, 0.05);
            border-top: 1px solid rgba(0, 255, 136, 0.1);
            font-size: 0.9rem;
            color: #576574;
        }
        .graph-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #576574;
        }
        .graph-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="console">
        <!-- 左側圖譜面板 -->
        <div class="graph-panel">
            <div class="graph-header">
                <h2>🛰️ 知識圖譜雷達</h2>
                <p>Neo4j 圖譜記憶視覺化</p>
            </div>
            <div id="graph-container">
                <div class="graph-loading" id="graph-loading">
                    <div class="spinner"></div>
                    <p>載入圖譜資料...</p>
                </div>
            </div>
        </div>

        <!-- 右側控制面板 -->
        <div class="control-panel">
            <div class="header">
                <h1>⚡ V1100 全息指揮台</h1>
                <p>MiroFish Local Engine — 蜂群推演指揮中心</p>
            </div>

            <div class="input-section">
                <div class="file-input-group">
                    <label for="file-input" id="file-input-label">📎 選擇現實種子檔案 (MD/CSV)</label>
                    <input type="file" id="file-input" accept=".md,.markdown,.csv" multiple style="display: none;">
                    <span id="file-name">未選擇檔案</span>
                    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                        <button id="historyBtn">🏛️ 注入歷史 (增量)</button>
                        <button id="dailyBtn">🎯 今日排位 (精準洗地)</button>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" id="prompt-input" placeholder="輸入推演指令 (例如: 請推演 2026-03-29 第 2 場)" value="請推演 2026-03-29 第 2 場">
                    <button id="startBtn">🚀 啟動蜂群推演</button>
                </div>

            </div>

            <div class="terminal" id="terminal-logs">
                <div class="log-entry log-system">[系統] V1100 全息指揮台已就緒，等待首長指令...</div>
            </div>

            <div class="status">
                <span class="pulse"></span>
                Stage 3 部署完成 · 雷達視覺化已啟動
            </div>
        </div>
    </div>

    <script>
        const promptInput = document.getElementById('prompt-input');
        const startBtn = document.getElementById('startBtn');
        const dailyBtn = document.getElementById('dailyBtn');
        const historyBtn = document.getElementById('historyBtn');

        const terminalLogs = document.getElementById('terminal-logs');
        const graphContainer = document.getElementById('graph-container');
        const graphLoading = document.getElementById('graph-loading');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');


        let graphChart = null;

        // 檔案選擇處理
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 1) {
                fileName.textContent = `已鎖定 ${files.length} 份情報卷宗 📦`;
                fileName.style.color = '#00ff88';
            } else if (files.length === 1) {
                fileName.textContent = files[0].name;
                fileName.style.color = '#00ff88';
            } else {
                fileName.textContent = '未選擇檔案';
                fileName.style.color = '#576574';
            }
        });

        function addLog(message, type = 'info') {
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.textContent = message;
            terminalLogs.appendChild(logEntry);
            terminalLogs.scrollTop = terminalLogs.scrollHeight;
        }

        // 初始化圖譜
        async function initGraph() {
            try {
                addLog('[雷達] 請求圖譜資料...', 'info');
                const response = await fetch('/api/graph_data');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();

                addLog(`[雷達] 載入 ${data.nodes.length} 個節點，${data.links.length} 條關係`, 'info');

                renderGraph(data);

            } catch (error) {
                addLog(`[雷達] Neo4j 離線，使用模擬圖譜數據`, 'error');
                
                // 模擬數據
                const mockData = {
                    nodes: [
                        { id: '馬匹A', category: 'Horse', name: '馬匹A' },
                        { id: '馬匹B', category: 'Horse', name: '馬匹B' },
                        { id: '馬匹C', category: 'Horse', name: '馬匹C' },
                        { id: '事件1', category: 'Incident', name: '事件1' },
                        { id: '事件2', category: 'Incident', name: '事件2' },
                        { id: '事件3', category: 'Incident', name: '事件3' }
                    ],
                    links: [
                        { source: '馬匹A', target: '事件1', type: 'HAS_INCIDENT' },
                        { source: '馬匹B', target: '事件2', type: 'HAS_INCIDENT' },
                        { source: '馬匹C', target: '事件3', type: 'HAS_INCIDENT' },
                        { source: '馬匹A', target: '事件2', type: 'HAS_INCIDENT' }
                    ]
                };

                renderGraph(mockData);
            }
        }

        // 渲染圖譜
        function renderGraph(data) {
            // 初始化 ECharts
            graphChart = echarts.init(graphContainer);

            // 設定節點顏色
            const categories = [
                { name: 'Horse', itemStyle: { color: '#74b9ff' } }, // 藍色
                { name: 'Incident', itemStyle: { color: '#ffa726' } }, // 橘色
                { name: 'Unknown', itemStyle: { color: '#999' } }
            ];

            // 處理節點數據
            const nodes = data.nodes.map(node => ({
                id: node.id,
                name: node.id,
                category: categories.findIndex(cat => cat.name === node.category) || 2,
                symbolSize: Math.max(20, Math.min(50, node.id.length * 3)), // 根據名稱長度調整大小
                ...node
            }));

            // 處理邊數據
            const links = data.links.map(link => ({
                source: link.source,
                target: link.target,
                value: link.type
            }));

            const option = {
                backgroundColor: 'transparent',
                series: [{
                    type: 'graph',
                    layout: 'force',
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true, // 允許縮放和平移
                    focusNodeAdjacency: true, // 點擊節點時高亮相鄰節點
                    draggable: true, // 允許拖拽節點
                    force: {
                        repulsion: 100, // 斥力
                        gravity: 0.1, // 重力
                        edgeLength: [50, 200], // 邊長範圍
                        layoutAnimation: true // 動畫效果
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: {
                            width: 10
                        }
                    },
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{b}'
                    },
                    lineStyle: {
                        color: 'source',
                        curveness: 0.3
                    },
                    emphasis: {
                        focus: 'adjacency',
                        lineStyle: {
                            width: 10
                        }
                    }
                }]
            };

            graphChart.setOption(option);
            graphLoading.style.display = 'none';
            addLog('[雷達] 圖譜渲染完成', 'system');
        }

        // 每日排位按鈕邏輯
        dailyBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) {
                addLog('[系統] 請先選擇今日排位檔案', 'error');
                return;
            }

            dailyBtn.disabled = true;
            dailyBtn.textContent = '🎯 正在注入...';
            addLog('[系統] 啟動精準打擊：正在清除舊排位並重鑄圖譜...', 'system');

            try {
                const formData = new FormData();
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                
                const response = await fetch('/api/upload/daily', {
                    method: 'POST',
                    body: formData,
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    addLog(`[系統] 注入失敗: ${errorText}`, 'error');
                    throw new Error(errorText);
                }
                
                const result = await response.json();
                addLog(`[系統] ${result.message}`, 'system');
                await initGraph();
            } catch (error) {
                addLog(`[系統] 異常: ${error.message}`, 'error');
            } finally {
                dailyBtn.disabled = false;
                dailyBtn.textContent = '🎯 今日排位 (精準洗地)';
            }
        });

        // 歷史資料按鈕邏輯
        historyBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) {
                addLog('[系統] 請先選擇歷史資料檔案', 'error');
                return;
            }

            historyBtn.disabled = true;
            historyBtn.textContent = '🏛️ 正在吞噬...';
            addLog('[系統] 啟動批量吞噬：正在增量更新歷史金庫...', 'system');

            try {
                const formData = new FormData();
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                
                const response = await fetch('/api/upload/history', {
                    method: 'POST',
                    body: formData,
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    addLog(`[系統] 吞噬失敗: ${errorText}`, 'error');
                    throw new Error(errorText);
                }
                
                const result = await response.json();
                addLog(`[系統] ${result.message}`, 'system');
                await initGraph();
            } catch (error) {
                addLog(`[系統] 異常: ${error.message}`, 'error');
            } finally {
                historyBtn.disabled = false;
                historyBtn.textContent = '🏛️ 注入歷史 (增量)';
            }
        });


        startBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                addLog('[系統] 請輸入推演指令', 'error');
                return;
            }

            // 禁用按鈕
            startBtn.disabled = true;
            startBtn.textContent = '⏳ 推演中...';
            addLog('[系統] 正在呼叫蜂群大腦進行戰術推演...', 'system');

            try {
                // 直接執行推演，不再處理檔案


                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: prompt }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();

                // 添加狀態日誌
                result.status_logs.forEach(log => {
                    addLog(log, 'info');
                });

                // 顯示戰術報告
                if (result.tactical_report) {
                    addLog('=== 戰術報告 ===', 'system');
                    // 將 Markdown 簡單顯示為文本（前端不解析 Markdown）
                    const reportLines = result.tactical_report.split('\n');
                    reportLines.forEach(line => {
                        if (line.trim()) {
                            addLog(line, 'info');
                        }
                    });
                }

                if (result.status === 'completed') {
                    addLog('[系統] 推演完成', 'system');
                } else if (result.status === 'aborted') {
                    addLog('[系統] 推演中止', 'error');
                } else {
                    addLog('[系統] 推演錯誤', 'error');
                }

            } catch (error) {
                addLog(`[系統] 請求失敗: ${error.message}`, 'error');
            } finally {
                // 恢復按鈕
                startBtn.disabled = false;
                startBtn.textContent = '🚀 啟動蜂群推演';
            }
        });

        // 允許按 Enter 鍵觸發
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startBtn.click();
            }
        });

        // 頁面載入時初始化圖譜
        window.addEventListener('load', initGraph);

        // 視窗調整大小時重新調整圖表大小
        window.addEventListener('resize', () => {
            if (graphChart) {
                graphChart.resize();
            }
        });
    </script>
</body>
</html>
